# Smithery configuration for Flight Radar
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_flightradar

name: flightradar-mcp
displayName: "Flight Radar"
description: >
  Radar de voos ao vivo: posição em tempo real de qualquer aeronave transmitindo ADS-B agora. Busque por matrícula, hex ICAO ou callsign, veja o tráfego num raio de qualquer ponto (ordenado por distância), descubra qual avião está passando em cima de você, liste aeronaves por tipo (A320, 737, PC-12) ou militares no ar. Inclui consulta de aeroportos por código IATA/ICAO, base offline com ~90 mil aeroportos com cidade, país, coordenadas e fuso. Dados da rede comunitária adsb.lol (cobertura maior em áreas urbanas). Sem credencial, hospedado pela plataforma.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/flightradar-mcp
repository: https://github.com/mcp-dir/flightradar-mcp

tags:
  - flightradar
  - brazil
  - med
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_flightradar

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_flightradar/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
